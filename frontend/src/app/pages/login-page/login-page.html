<main class="login">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>

    <label for="username">Username</label>
    <input id="username" formControlName="username" autocomplete="username" />
    @if (form.controls.username.touched && form.controls.username.invalid) {
      <small class="field-error">Username must be at least 3 characters.</small>
    }

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="field-error">Password must be at least 6 characters.</small>
    }

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting() || form.invalid">
      {{ submitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</main>
