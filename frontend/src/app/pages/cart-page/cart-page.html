<a class="back" routerLink="/products">&larr; Continue shopping</a>
<h1>Your cart</h1>

@if (isEmpty()) {
  <div class="empty">
    <p>Your cart is empty.</p>
    <a routerLink="/products">Browse games</a>
  </div>
} @else {
  <div class="cart-card">
    <table class="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Location</th>
          <th class="num">Price</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (item of cart.items(); track item.id) {
          <tr>
            <td class="title">{{ item.title }}</td>
            <td><span class="badge">{{ item.location }}</span></td>
            <td class="num">{{ item.price }}</td>
            <td><button type="button" class="remove" (click)="cart.remove(item.id)">Remove</button></td>
          </tr>
        }
      </tbody>
      <tfoot>
        <tr>
          <td colspan="2" class="grand-label">Total</td>
          <td class="num grand">{{ cart.total().toFixed(2) }}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    @if (error()) { <p class="error" role="alert">{{ error() }}</p> }

    <div class="actions">
      <button type="button" class="checkout" (click)="checkout()" [disabled]="placing()">
        {{ placing() ? 'Placing order…' : 'Checkout' }}
      </button>
    </div>
  </div>
}
