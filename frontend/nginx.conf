server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files; fall back to index.html so Angular client-side
    # routes (e.g. /orders/2) work on refresh and deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache built assets aggressively (they are content-hashed by Angular)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
